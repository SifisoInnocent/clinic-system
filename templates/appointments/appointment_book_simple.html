{% extends 'base.html' %}

{% block title %}Book Appointment - CCAMS{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-calendar-plus me-2"></i>Book Appointment</h4>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                    
                    <form method="post" id="bookingForm">
                        {% csrf_token %}
                        
                        <!-- Staff Selection -->
                        <div class="mb-3">
                            <label for="staff" class="form-label fw-bold">Select Staff Member</label>
                            <select class="form-select" id="staff" name="staff" required onchange="loadAvailability()">
                                <option value="">-- Choose Staff Member --</option>
                                {% for staff in staff_members %}
                                    <option value="{{ staff.id }}" data-role="{{ staff.role }}">
                                        {{ staff.get_full_name }} ({{ staff.role|title }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <!-- Date Selection -->
                        <div class="mb-3">
                            <label for="appointment_date" class="form-label fw-bold">Select Date</label>
                            <input type="date" class="form-control" id="appointment_date" name="appointment_date" 
                                   min="{{ today|date:'Y-m-d' }}" required onchange="loadAvailability()">
                        </div>
                        
                        <!-- Available Time Slots -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Available Time Slots</label>
                            <div id="timeSlotsContainer">
                                <p class="text-muted">Select a staff member and date to see available times</p>
                            </div>
                            <input type="hidden" id="appointment_time" name="appointment_time" required>
                        </div>
                        
                        <!-- Reason -->
                        <div class="mb-3">
                            <label for="reason" class="form-label fw-bold">Reason for Visit</label>
                            <textarea class="form-control" id="reason" name="reason" rows="3" 
                                      placeholder="Please describe the reason for your appointment" required></textarea>
                        </div>
                        
                        <!-- Hidden field for provider type -->
                        <input type="hidden" id="provider_type" name="provider_type">
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-check me-2"></i>Book Appointment
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function loadAvailability() {
    const staffId = document.getElementById('staff').value;
    const date = document.getElementById('appointment_date').value;
    const container = document.getElementById('timeSlotsContainer');
    const timeInput = document.getElementById('appointment_time');
    const providerTypeInput = document.getElementById('provider_type');
    
    // Clear previous selection
    timeInput.value = '';
    
    if (!staffId || !date) {
        container.innerHTML = '<p class="text-muted">Select a staff member and date to see available times</p>';
        return;
    }
    
    // Set provider type based on staff selection
    const staffOption = document.querySelector(`#staff option[value="${staffId}"]`);
    if (staffOption) {
        providerTypeInput.value = staffOption.dataset.role;
    }
    
    container.innerHTML = '<div class="text-center"><div class="spinner-border text-primary" role="status"></div></div>';
    
    fetch(`/appointments/api/available-slots/?staff_id=${staffId}&date=${date}`)
        .then(res => res.json())
        .then(data => {
            if (data.slots && data.slots.length > 0) {
                let html = '<div class="d-flex flex-wrap gap-2">';
                data.slots.forEach(slot => {
                    html += `<button type="button" class="btn btn-outline-success slot-btn" 
                                   onclick="selectTime('${slot.time}', this)">${slot.display}</button>`;
                });
                html += '</div>';
                
                if (data.booked && data.booked.length > 0) {
                    html += '<div class="mt-2"><small class="text-muted">Booked: ';
                    data.booked.forEach(slot => {
                        html += `<span class="badge bg-secondary me-1">${slot.display}</span>`;
                    });
                    html += '</small></div>';
                }
                
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="alert alert-warning"><i class="fas fa-exclamation-triangle me-2"></i>No available slots for this date. Please try a different date.</div>';
            }
        })
        .catch(err => {
            console.error('Error:', err);
            container.innerHTML = '<div class="alert alert-danger">Error loading availability. Please try again.</div>';
        });
}

function selectTime(time, btn) {
    // Update hidden input
    document.getElementById('appointment_time').value = time;
    
    // Update button styles
    document.querySelectorAll('.slot-btn').forEach(b => {
        b.classList.remove('btn-success');
        b.classList.add('btn-outline-success');
    });
    btn.classList.remove('btn-outline-success');
    btn.classList.add('btn-success');
}
</script>
{% endblock %}
